<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Check your email | Smart Energy</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { min-height: 100vh; margin: 0; padding: 20px; display: grid; place-items: center; background: linear-gradient(135deg, #667eea, #764ba2); }
        main { width: min(100%, 460px); padding: 30px; border-radius: 14px; background: #fff; box-shadow: 0 12px 35px #20204033; }
        h1 { color: #333; font-size: 1.5rem; }
        p { color: #666; line-height: 1.55; }
        a { display: inline-block; width: 100%; margin-top: 18px; padding: 12px; border-radius: 8px; color: white; background: linear-gradient(135deg, #667eea, #764ba2); font-weight: 600; text-align: center; text-decoration: none; }
    </style>
</head>
<body>
<main>
    <h1>Check your email</h1>
    <p>If an eligible account exists for that address, password reset instructions have been sent. The same message is shown whether or not an account exists.</p>
    <a href="{% url 'login_view' %}">Return to login</a>
</main>
</body>
</html>
