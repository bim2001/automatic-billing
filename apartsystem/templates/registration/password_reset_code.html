<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Enter verification code</title><style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;margin:0;padding:20px;display:grid;place-items:center;background:linear-gradient(135deg,#667eea,#764ba2)}main{width:min(100%,460px);padding:30px;border-radius:14px;background:#fff}p{color:#555;line-height:1.55}label{display:block;margin:20px 0 6px}input{width:100%;padding:11px;border:2px solid #ddd;border-radius:8px;font-size:1.2rem;letter-spacing:.2em}button,a{display:inline-block;width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;color:#fff;background:linear-gradient(135deg,#667eea,#764ba2);font-weight:600;text-align:center;text-decoration:none;cursor:pointer}.error{color:#b42318}</style></head><body><main><h1>Check your email</h1><p>If an account can receive a reset code at the address you confirmed, we’ve sent a code. Enter it below. Codes expire after 10 minutes.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label for="code">6-digit verification code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit">Verify code</button></form><a href="{% url 'password_reset_confirm_email' %}">Request another code</a></main></body></html>
