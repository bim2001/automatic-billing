<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forgot password</title><style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;margin:0;padding:20px;display:grid;place-items:center;background:linear-gradient(135deg,#667eea,#764ba2)}main{width:min(100%,460px);padding:30px;border-radius:14px;background:#fff;box-shadow:0 12px 35px #20204033}h1{font-size:1.5rem;color:#333}p{color:#666;line-height:1.55}label{display:block;margin:20px 0 6px;color:#555}input{width:100%;padding:11px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:1rem}button,a{display:inline-block;width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;color:#fff;background:linear-gradient(135deg,#667eea,#764ba2);font-weight:600;text-align:center;text-decoration:none;cursor:pointer}.error{color:#b42318}</style></head><body><main><h1>Forgot your password?</h1><p>Enter your account email. If an account can receive a reset code, we’ll send one after you confirm the address.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label for="email">Email address</label><input id="email" name="email" type="email" value="{{ email|default:'' }}" required autocomplete="email"><button type="submit">Continue</button></form><a href="{% url 'login_view' %}">Back to Login</a></main></body></html>
