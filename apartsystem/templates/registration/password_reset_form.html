<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password | Smart Energy</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { min-height: 100vh; margin: 0; padding: 20px; display: grid; place-items: center; background: linear-gradient(135deg, #667eea, #764ba2); }
        main { width: min(100%, 460px); padding: 30px; border-radius: 14px; background: #fff; box-shadow: 0 12px 35px #20204033; }
        h1 { margin: 0 0 10px; color: #333; font-size: 1.5rem; }
        p { color: #666; line-height: 1.55; }
        label { display: block; margin: 20px 0 6px; color: #555; font-size: .9rem; }
        input { width: 100%; padding: 11px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; }
        input:focus { outline: none; border-color: #667eea; }
        button, .link { display: inline-block; width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 8px; color: white; background: linear-gradient(135deg, #667eea, #764ba2); font-size: .95rem; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; }
        .errors { color: #b42318; font-size: .9rem; }
        @media (max-width: 480px) { main { padding: 22px; } }
    </style>
</head>
<body>
<main>
    <h1>Forgot your password?</h1>
    <p>Enter the email address used for your account. If an eligible account exists, we’ll send instructions to reset its password.</p>
    <form method="post">
        {% csrf_token %}
        <label for="id_email">Email address</label>
        {{ form.email }}
        {% if form.email.errors %}<div class="errors" role="alert">{{ form.email.errors }}</div>{% endif %}
        <button type="submit">Send reset instructions</button>
    </form>
    <a class="link" href="{% url 'login_view' %}">Return to login</a>
</main>
</body>
</html>
