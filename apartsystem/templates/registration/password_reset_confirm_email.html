<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirm email</title><style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;margin:0;padding:20px;display:grid;place-items:center;background:linear-gradient(135deg,#667eea,#764ba2)}main{width:min(100%,460px);padding:30px;border-radius:14px;background:#fff}p{color:#555;line-height:1.55}button,a{display:inline-block;width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;color:#fff;background:linear-gradient(135deg,#667eea,#764ba2);font-weight:600;text-align:center;text-decoration:none;cursor:pointer}</style></head><body><main><h1>Confirm your email</h1><p>Request a password reset code for <strong>{{ email }}</strong>?</p><p>If an account can receive a code at this address, we’ll send it. Otherwise, you’ll see the same next step.</p><form method="post">{% csrf_token %}<button type="submit">Confirm and request code</button></form><a href="{% url 'password_reset' %}">Edit email</a></main></body></html>
