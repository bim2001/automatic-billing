<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Set a new password</title><style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{min-height:100vh;margin:0;padding:20px;display:grid;place-items:center;background:linear-gradient(135deg,#667eea,#764ba2)}main{width:min(100%,460px);padding:30px;border-radius:14px;background:#fff}p{color:#555}label{display:block;margin:16px 0 6px}input{width:100%;padding:11px;border:2px solid #ddd;border-radius:8px}button,a{display:inline-block;width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;color:#fff;background:linear-gradient(135deg,#667eea,#764ba2);font-weight:600;text-align:center;text-decoration:none;cursor:pointer}.error{color:#b42318}</style></head><body><main><h1>Set a new password</h1><form method="post">{% csrf_token %}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<p>{{ field.help_text|safe }}</p>{% endif %}{% for error in field.errors %}<p class="error" role="alert">{{ error }}</p>{% endfor %}{% endfor %}{% for error in form.non_field_errors %}<p class="error" role="alert">{{ error }}</p>{% endfor %}<button type="submit">Save new password</button></form></main></body></html>
