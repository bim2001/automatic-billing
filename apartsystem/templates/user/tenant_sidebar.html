{% load static %}
{% if not tenant_sidebar_css_in_head %}
<link rel="stylesheet" href="{% static 'css/tenant-sidebar.css' %}">
{% endif %}

<button class="tenant-sidebar-toggle" type="button" aria-controls="tenant-sidebar" aria-expanded="false" aria-label="Open navigation">
    <i class="fas fa-bars" aria-hidden="true"></i>
</button>
<div class="tenant-sidebar-backdrop" data-tenant-sidebar-close></div>
<aside class="sidebar tenant-sidebar" id="tenant-sidebar" aria-label="Tenant navigation" tabindex="-1">
    <button class="tenant-sidebar-close" type="button" aria-label="Close navigation">
        <i class="fas fa-times" aria-hidden="true"></i>
    </button>
    <div class="sidebar-header">
        <div class="logo">
            <i class="fas fa-bolt"></i>
            <span>Smart Energy</span>
        </div>
        <div class="version">
            <div>{{ admin_contact.name }}</div>
            <div><i class="fas fa-phone-alt"></i> {{ admin_contact.phone }}</div>
        </div>
    </div>

    <div class="nav-menu">
        <div class="nav-item">
            <a href="{% url 'tenant_dashboard' %}" class="nav-link" data-tooltip="Dashboard" data-tenant-nav="dashboard">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
        </div>
        <div class="nav-divider"></div>
        <div class="nav-item">
            <a href="{% url 'payment_method' %}" class="nav-link" data-tooltip="Payment" data-tenant-nav="payment">
                <i class="fas fa-credit-card"></i>
                <span>Payment</span>
            </a>
        </div>
        <div class="nav-item">
            <a href="{% url 'tenant_notifications' %}" class="nav-link" data-tooltip="Notifications" data-tenant-nav="notifications">
                <i class="fas fa-bell"></i>
                <span>Notifications</span>
                {% if unread_alerts_count > 0 %}
                <span class="alert-badge">
                    {{ unread_alerts_count }}
                </span>
                {% endif %}
            </a>
        </div>
        <!-- ✅ BILLING HISTORY LINK - NASA SIDEBAR NA -->
        <div class="nav-item">
            <a href="{% url 'tenant_billing_history' %}" class="nav-link" data-tooltip="Billing History" data-tenant-nav="history">
                <i class="fas fa-history"></i>
                <span>Billing History</span>
            </a>
        </div>
        <div class="nav-divider"></div>
        <div class="nav-item">
            <a href="{% url 'edit_profile' %}" class="nav-link" data-tooltip="Profile" data-tenant-nav="profile">
                <i class="fas fa-user-edit"></i>
                <span>Edit Profile</span>
            </a>
        </div>
    </div>

    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="user-details">
                <div class="user-name">{{ username }}</div>
                <div class="user-role">Tenant</div>
            </div>
        </div>
        <a href="{% url 'logout_view' %}" class="nav-link" style="padding-left: 0;">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a>
    </div>
</aside>
<script src="{% static 'js/tenant-nav.js' %}" defer></script>
