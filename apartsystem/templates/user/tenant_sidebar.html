{% load static %}
<link rel="stylesheet" href="{% static 'css/sidebar.css' %}">

<div class="sidebar">
    <div class="sidebar-header">
        <div class="logo">
            <i class="fas fa-bolt"></i>
            <span>Smart Energy</span>
        </div>
        <div class="version">
            <div>{{ admin_contact.name }}</div>
            <div><i class="fas fa-phone-alt"></i> {{ admin_contact.phone }}</div>
        </div>
    </div>

    <div class="nav-menu">
        <div class="nav-item">
            <a href="{% url 'tenant_dashboard' %}" class="nav-link" data-tooltip="Dashboard">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
        </div>
        <div class="nav-divider"></div>
        <div class="nav-item">
            <a href="{% url 'payment_method' %}" class="nav-link" data-tooltip="Payment">
                <i class="fas fa-credit-card"></i>
                <span>Payment</span>
            </a>
        </div>
        <div class="nav-item">
            <a href="{% url 'tenant_notifications' %}" class="nav-link" data-tooltip="Notifications">
                <i class="fas fa-bell"></i>
                <span>Notifications</span>
                {% if unread_alerts_count > 0 %}
                <span class="alert-badge">
                    {{ unread_alerts_count }}
                </span>
                {% endif %}
            </a>
        </div>
        <!-- ✅ BILLING HISTORY LINK - NASA SIDEBAR NA -->
        <div class="nav-item">
            <a href="{% url 'tenant_billing_history' %}" class="nav-link" data-tooltip="Billing History">
                <i class="fas fa-history"></i>
                <span>Billing History</span>
            </a>
        </div>
        <div class="nav-divider"></div>
        <div class="nav-item">
            <a href="{% url 'edit_profile' %}" class="nav-link" data-tooltip="Profile">
                <i class="fas fa-user-edit"></i>
                <span>Edit Profile</span>
            </a>
        </div>
    </div>

    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="user-details">
                <div class="user-name">{{ username }}</div>
                <div class="user-role">Tenant</div>
            </div>
        </div>
        <a href="{% url 'logout_view' %}" class="nav-link" style="padding-left: 0;">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a>
    </div>
</div>
