{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile - Smart Energy</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
            margin: 0;
        }

        /* 🔥 EXACT SAME SIDEBAR AS BILLING */
        .sidebar {
            width: 280px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .sidebar-header {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo i {
            font-size: 26px;
        }

        .nav-menu {
            flex: 1;
            padding: 0 15px;
        }

        .nav-item {
            margin-bottom: 5px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s;
            font-size: 15px;
        }

        .nav-link i {
            width: 22px;
            font-size: 18px;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.2);
        }
        

        .nav-link.active {
            background: rgba(255,255,255,0.22);
            font-weight: 600;
            border-left: 4px solid white;
        }

        .nav-divider {
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin: 15px 0;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
        }

        /* 🔥 IMPORTANT: SAME MAIN CONTENT RULE */
        .main-content {
            margin-left: 280px;
            padding: 30px;
            min-height: 100vh;
        }

        /* PROFILE CARD */
        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

    </style>
</head>

<body>

<!-- SIDEBAR (same structure as billing_history) -->
<div class="sidebar">

    <div class="sidebar-header">
        <div class="logo">
            <i class="fas fa-bolt"></i>
            Smart Energy Monitor
        </div>
    </div>

    <div class="nav-menu">

        <div class="nav-item">
            <a href="{% url 'tenant_dashboard' %}" class="nav-link">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
        </div>

        <div class="nav-divider"></div>

        <div class="nav-item">
            <a href="{% url 'payment_method' %}" class="nav-link">
                <i class="fas fa-credit-card"></i>
                <span>Payment</span>
            </a>
        </div>

        <div class="nav-item">
            <a href="{% url 'tenant_billing_history' %}" class="nav-link">
                <i class="fas fa-history"></i>
                <span>Billing History</span>
            </a>
        </div>

        <div class="nav-item">
            <a href="{% url 'edit_profile' %}" class="nav-link active">
                <i class="fas fa-user-edit"></i>
                <span>Edit Profile</span>
            </a>
        </div>

        <div class="nav-divider"></div>

        <div class="nav-item">
            <a href="{% url 'logout_view' %}" class="nav-link">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </a>
        </div>

    </div>

</div>

<!-- MAIN CONTENT -->
<div class="main-content">

    <div class="profile-card">

        <h1><i class="fas fa-user-circle"></i> Edit Profile</h1>
        <div class="subtitle">Update your personal information</div>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" value="{{ username }}" disabled>
            </div>

            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" value="{{ first_name }}">
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" value="{{ last_name }}">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ email }}">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone_number" value="{{ phone_number }}">
            </div> 

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{% url 'tenant_dashboard' %}" class="btn btn-secondary">Cancel</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
